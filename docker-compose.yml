services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/researchpilot.db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - researchpilot-data:/data
  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  researchpilot-data:
